# VPC Lattice resources for Items service (Backend-A) — HTTPS mode
#
# Single VPC Lattice service at items.<domain> with header-based routing:
#   x-service: catalog → catalog-service
#   x-service: pricing → pricing-service
#
# Placeholders: <VPCLATTICE_CERTIFICATE_ARN>, <ITEMS_HOSTNAME>, <SERVICE_NETWORK_NAME>, <ITEMS_LOG_GROUP_ARN>
# =============================================================================
# VpcAssociationPolicy — Backend-A only serves traffic, doesn't consume
# =============================================================================
---
apiVersion: application-networking.k8s.aws/v1alpha1
kind: VpcAssociationPolicy
metadata:
  name: disable-vpc-association
spec:
  targetRef:
    group: "gateway.networking.k8s.io"
    kind: Gateway
    name: <SERVICE_NETWORK_NAME>
  associateWithVpc: false
# =============================================================================
# Gateway — single VPC Lattice service for items (HTTPS)
# =============================================================================
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: <SERVICE_NETWORK_NAME>
spec:
  gatewayClassName: amazon-vpclattice-controller
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - name: unused
      options:
        application-networking.k8s.aws/certificate-arn: "<VPCLATTICE_CERTIFICATE_ARN>"
# =============================================================================
# HTTPRoute — header-based routing: x-service: catalog | pricing
# =============================================================================
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: items-route
spec:
  hostnames:
  - "<ITEMS_HOSTNAME>"
  parentRefs:
  - name: <SERVICE_NETWORK_NAME>
    sectionName: https
  rules:
  - matches:
    - headers:
      - name: x-service
        value: catalog
    backendRefs:
    - name: catalog-service
      kind: Service
      port: 8000
  - matches:
    - headers:
      - name: x-service
        value: pricing
    backendRefs:
    - name: pricing-service
      kind: Service
      port: 8000
# =============================================================================
# TargetGroupPolicies — health checks for each backend
# =============================================================================
---
apiVersion: application-networking.k8s.aws/v1alpha1
kind: TargetGroupPolicy
metadata:
  name: catalog-service-tgp
spec:
  targetRef:
    group: ""
    kind: Service
    name: catalog-service
  protocol: HTTP
  protocolVersion: HTTP1
  healthCheck:
    enabled: true
    path: "/health"
    port: 8000
    protocol: HTTP
    protocolVersion: HTTP1
    statusMatch: "200"
    intervalSeconds: 10
    timeoutSeconds: 5
    healthyThresholdCount: 2
    unhealthyThresholdCount: 3
---
apiVersion: application-networking.k8s.aws/v1alpha1
kind: TargetGroupPolicy
metadata:
  name: pricing-service-tgp
spec:
  targetRef:
    group: ""
    kind: Service
    name: pricing-service
  protocol: HTTP
  protocolVersion: HTTP1
  healthCheck:
    enabled: true
    path: "/health"
    port: 8000
    protocol: HTTP
    protocolVersion: HTTP1
    statusMatch: "200"
    intervalSeconds: 10
    timeoutSeconds: 5
    healthyThresholdCount: 2
    unhealthyThresholdCount: 3
# =============================================================================
# IAMAuthPolicy
# =============================================================================
---
apiVersion: application-networking.k8s.aws/v1alpha1
kind: IAMAuthPolicy
metadata:
  name: items-service-auth
spec:
  targetRef:
    group: "gateway.networking.k8s.io"
    kind: HTTPRoute
    name: items-route
  policy: |
    {
      "Version": "2012-10-17",
      "Statement": [{
        "Effect": "Allow",
        "Principal": "*",
        "Resource": "*",
        "Condition": { "StringNotEqualsIgnoreCase": { "aws:PrincipalType": "anonymous" } },
        "Action": "*"
      }]
    }
# =============================================================================
# AccessLogPolicy
# =============================================================================
---
apiVersion: application-networking.k8s.aws/v1alpha1
kind: AccessLogPolicy
metadata:
  name: items-service-access-logs
spec:
  destinationArn: "<ITEMS_LOG_GROUP_ARN>"
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: items-route
