apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
  labels:
    app: cart-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cart-service
  template:
    metadata:
      labels:
        app: cart-service
    spec:
      serviceAccountName: cart-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      containers:
      - name: cart-service
        image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/eks-gateway-demo/cart:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: PAYMENTS_SERVICE_URL
          value: "<VPCLATTICE_PROTOCOL>://payments.<PRIVATE_ZONE>"
        - name: AWS_REGION
          value: "<AWS_REGION>"
        - name: REQUEST_TIMEOUT
          value: "10"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: tmp
        emptyDir:
          medium: Memory
