# ALB Gateway API resources for the frontend service — HTTP mode
#
# WARNING: HTTP mode is intended for test environments only.
# Traffic between the client and the ALB is unencrypted.
# Use alb-gateway-https.yaml for production deployments.
#
# Placeholders:
#   <WAF_ACL_ARN>  — WAF WebACL ARN (WAF is always enabled regardless of protocol)
---
apiVersion: gateway.k8s.aws/v1beta1
kind: LoadBalancerConfiguration
metadata:
  name: frontend-alb-config
spec:
  scheme: internet-facing
  wafV2:
    webACL: "<WAF_ACL_ARN>"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: frontend-gateway
spec:
  gatewayClassName: aws-lb-controller
  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: frontend-alb-config
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-route
  annotations:
    external-dns/zone: public
spec:
  parentRefs:
  - name: frontend-gateway
    sectionName: http
  rules:
  - backendRefs:
    - name: frontend-service
      port: 80
---
apiVersion: gateway.k8s.aws/v1beta1
kind: TargetGroupConfiguration
metadata:
  name: frontend-tgc
spec:
  targetReference:
    kind: Service
    name: frontend-service
  defaultConfiguration:
    targetType: ip
