# ALB Gateway API resources for the frontend service — HTTPS mode
# Provisions an internet-facing ALB with HTTPS listener, ACM certificate, and WAF.
#
# Placeholders:
#   <ALB_CERTIFICATE_ARN>   — ACM certificate ARN for the HTTPS listener
#   <WAF_ACL_ARN>           — WAF WebACL ARN
#   <FRONTEND_DOMAIN_NAME>  — Custom domain name (e.g. frontend.app.example.com)
---
apiVersion: gateway.k8s.aws/v1beta1
kind: LoadBalancerConfiguration
metadata:
  name: frontend-alb-config
spec:
  scheme: internet-facing
  wafV2:
    webACL: "<WAF_ACL_ARN>"
  listenerConfigurations:
    - protocolPort: HTTPS:443
      defaultCertificate: "<ALB_CERTIFICATE_ARN>"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: frontend-gateway
spec:
  gatewayClassName: aws-alb
  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: frontend-alb-config
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-route
spec:
  hostnames:
  - "<FRONTEND_DOMAIN_NAME>"
  parentRefs:
  - name: frontend-gateway
    sectionName: https
  rules:
  - backendRefs:
    - name: frontend-service
      port: 80
---
apiVersion: gateway.k8s.aws/v1beta1
kind: TargetGroupConfiguration
metadata:
  name: frontend-tgc
spec:
  targetReference:
    kind: Service
    name: frontend-service
  defaultConfiguration:
    targetType: ip
