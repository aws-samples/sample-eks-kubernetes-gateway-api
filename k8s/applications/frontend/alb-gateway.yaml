# ALB Gateway API resources for the frontend service
# Provisions an internet-facing ALB via the standalone AWS Load Balancer Controller
# (installed with Gateway API feature gates, NOT the EKS Auto Mode built-in LBC).
#
# Placeholders: <CERTIFICATE_ARN>, <WAF_ACL_ARN>, <FRONTEND_DOMAIN_NAME>
---
apiVersion: gateway.k8s.aws/v1beta1
kind: LoadBalancerConfiguration
metadata:
  name: frontend-alb-config
spec:
  scheme: internet-facing
  wafV2:
    webACL: "<WAF_ACL_ARN>"
  listenerConfigurations:
    - protocolPort: HTTPS:443
      defaultCertificate: "<CERTIFICATE_ARN>"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: frontend-gateway
spec:
  gatewayClassName: aws-alb
  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: frontend-alb-config
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
  - name: https
    protocol: HTTPS
    port: 443
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-route
spec:
  hostnames:
  - "<FRONTEND_DOMAIN_NAME>"
  parentRefs:
  - name: frontend-gateway
    sectionName: http
  - name: frontend-gateway
    sectionName: https
  rules:
  - backendRefs:
    - name: frontend-service
      port: 80
---
apiVersion: gateway.k8s.aws/v1beta1
kind: TargetGroupConfiguration
metadata:
  name: frontend-tgc
spec:
  targetReference:
    kind: Service
    name: frontend-service
  defaultConfiguration:
    targetType: ip
