apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
  labels:
    app: bff
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bff
  template:
    metadata:
      labels:
        app: bff
    spec:
      serviceAccountName: bff-service-account
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: bff
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      containers:
      - name: bff
        # Replace <ACCOUNT_ID> and <REGION> with your values
        image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/eks-gateway-demo/bff:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: ITEMS_SERVICE_URL
          value: "<VPCLATTICE_PROTOCOL>://items.<PRIVATE_ZONE>"
        - name: PAYMENTS_SERVICE_URL
          value: "<VPCLATTICE_PROTOCOL>://payments.<PRIVATE_ZONE>"
        - name: REQUEST_TIMEOUT
          value: "10"
        - name: AWS_REGION
          value: "<AWS_REGION>"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi   # no CPU limit — fractional limits cause throttling; requests handle scheduling
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 10   # must exceed HEALTH_TIMEOUT (3s) — backend calls can be slow on first attempt
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 6  # allow more failures — backends may not be up yet when BFF starts
      volumes:
      - name: tmp
        emptyDir:
          medium: Memory
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bff-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: bff
