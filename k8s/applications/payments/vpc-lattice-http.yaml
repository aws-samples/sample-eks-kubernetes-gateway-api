# VPC Lattice resources for Payments Service (Edge Cluster) — HTTP mode
#
# Payments is published as a VPC Lattice service from the edge cluster,
# consumed by the cart service on Backend-B during checkout.
# The edge VPC is already associated with the service network via Terraform.
#
# Placeholders: <PAYMENTS_HOSTNAME>, <SERVICE_NETWORK_NAME>, <PAYMENTS_LOG_GROUP_ARN>
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: <SERVICE_NETWORK_NAME>
spec:
  gatewayClassName: amazon-vpclattice-controller
  listeners:
  - name: http
    protocol: HTTP
    port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: payments-route
  annotations:
    external-dns/zone: private
spec:
  hostnames:
  - "<PAYMENTS_HOSTNAME>"
  parentRefs:
  - name: <SERVICE_NETWORK_NAME>
    sectionName: http
  rules:
  - backendRefs:
    - name: payments-service
      kind: Service
      port: 8000
---
apiVersion: application-networking.k8s.aws/v1alpha1
kind: TargetGroupPolicy
metadata:
  name: payments-service-tgp
spec:
  targetRef:
    group: ""
    kind: Service
    name: payments-service
  protocol: HTTP
  protocolVersion: HTTP1
  healthCheck:
    enabled: true
    path: "/health"
    port: 8000
    protocol: HTTP
    protocolVersion: HTTP1
    statusMatch: "200"
    intervalSeconds: 10
    timeoutSeconds: 5
    healthyThresholdCount: 2
    unhealthyThresholdCount: 3
---
apiVersion: application-networking.k8s.aws/v1alpha1
kind: IAMAuthPolicy
metadata:
  name: payments-service-auth
spec:
  targetRef:
    group: "gateway.networking.k8s.io"
    kind: HTTPRoute
    name: payments-route
  policy: |
    {
      "Version": "2012-10-17",
      "Statement": [{
        "Effect": "Allow",
        "Principal": "*",
        "Resource": "*",
        "Condition": { "StringNotEqualsIgnoreCase": { "aws:PrincipalType": "anonymous" } },
        "Action": "*"
      }]
    }
---
apiVersion: application-networking.k8s.aws/v1alpha1
kind: AccessLogPolicy
metadata:
  name: payments-service-access-logs
spec:
  destinationArn: "<PAYMENTS_LOG_GROUP_ARN>"
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: payments-route
