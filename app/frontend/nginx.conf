server {
    listen 8080;  # nginx-unprivileged listens on 8080 (non-root cannot bind port 80)
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers — protect against common web vulnerabilities.
    # Note: Strict-Transport-Security is omitted here because this server
    # only handles HTTP internally (TLS is terminated at the ALB).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Proxy API requests to the BFF service.
    # The BFF handles SigV4 signing for VPC Lattice — the browser never
    # touches AWS credentials directly.
    location /api/ {
        proxy_pass http://bff-service.default.svc.cluster.local:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve static files, fallback to index.html for SPA routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
