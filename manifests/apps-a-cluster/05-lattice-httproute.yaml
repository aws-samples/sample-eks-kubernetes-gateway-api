apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cart-route
  namespace: eks-gateway-demo
spec:
  parentRefs:
  - name: core-apis-service-network
    sectionName: https
  hostnames:
  - cart.api.example.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: cart
      port: 80
