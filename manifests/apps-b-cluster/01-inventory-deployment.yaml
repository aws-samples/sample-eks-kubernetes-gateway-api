apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: eks-gateway-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      containers:
        - name: inventory
          image: hashicorp/http-echo
          args:
            - "-listen=:80"
            - "-text=Hello from inventory.api.example.com - 42 items in stock!"
          ports:
            - containerPort: 80
