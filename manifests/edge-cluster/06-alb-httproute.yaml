apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop-route
  namespace: eks-gateway-demo
spec:
  parentRefs:
  - name: shop-gateway
    sectionName: https
  hostnames:
  - shop.api.example.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: shop
      port: 80
