apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: eks-gateway-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      containers:
        - name: shop
          image: hashicorp/http-echo
          args:
            - "-listen=:80"
            - "-text=Hello from shop.api.example.com - I can call payments and inventory!"
          ports:
            - containerPort: 80
          env:
            - name: PAYMENTS_URL
              value: "http://payments.api.example.com"
            - name: INVENTORY_URL
              value: "http://inventory.api.example.com"
