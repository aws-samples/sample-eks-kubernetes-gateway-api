apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: eks-gateway-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      containers:
      - name: payments
        image: hashicorp/http-echo
        args:
          - "-text=Hello from payments.api.example.com - Payment processed successfully!"
        ports:
        - containerPort: 5678
